server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 12m;

    # index.html не кэшируем: имена ассетов хешированные, и старый index после
    # деплоя тянет удалённые файлы — страница белеет до жёсткой перезагрузки.
    # expires -1 отдаёт Cache-Control: no-cache, то есть перепроверку по ETag
    # (обычно 304 в 150 байт), а не повторную загрузку.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Chat is server-sent events: buffering here would hold every tool-call
    # update until the turn ended, which is exactly what we want to avoid.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
