services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Required for the chat agent. Everything else has a working default.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-5}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TITLE: Gantt Plan Agent
      PLAN_DB_PATH: /data/plans.sqlite3
      MAX_TOOL_STEPS: ${MAX_TOOL_STEPS:-10}
      # The browser talks to nginx, which proxies /api — same origin, so CORS is
      # only needed if you expose the backend port directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - plan-data:/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-8080}:80"

volumes:
  plan-data:
